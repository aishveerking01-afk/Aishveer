name: Build Rui APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Java Development Kit (JDK) 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK Environment
      uses: android-actions/setup-android@v3

    - name: Grant Execute Permission for Gradle Wrapper
      run: |
        if [ -f gradlew ]; then
          chmod +x gradlew
        else
          echo "gradlew wrapper missing from root directory"
        fi

    - name: Compile and Build Assembly Release APK
      run: |
        if [ -f gradlew ]; then
          ./gradlew assembleRelease --no-daemon
        else
          echo "Cannot build because project files are not in the root directory folder."
          exit 1
        fi

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Rui-APK
        path: app/build/outputs/apk/release/app-release-unsigned.apk
