name: Build Rui APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Java Development Kit (JDK) 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Run Build in Subfolder Automatically
      run: |
        # Look for the directory containing gradlew dynamically
        GRADLEW_PATH=$(find . -name gradlew -print -quit)
        
        if [ -z "$GRADLEW_PATH" ]; then
          echo "Error: Could not find gradlew anywhere in the uploaded files."
          exit 1
        fi
        
        # Get the directory of that file
        SUBFOLDER_DIR=$(dirname "$GRADLEW_PATH")
        echo "Found project files inside: $SUBFOLDER_DIR"
        
        # Navigate to the correct directory, grant permissions, and build the APK
        cd "$SUBFOLDER_DIR"
        chmod +x gradlew
        ./gradlew assembleRelease --no-daemon
        
        # Copy the finished APK file back to the root workspace area so GitHub can find it
        mkdir -p $GITHUB_WORKSPACE/output_apk
        find . -name "*.apk" -exec cp {} $GITHUB_WORKSPACE/output_apk/ \;

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Rui-APK
        path: output_apk/
